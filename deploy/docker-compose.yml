name: devstore
services:
  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    environment:
      API_UPSTREAM: api:8080
      WEB_UPSTREAM: web:3000
    ports: ["127.0.0.1:80:80"]
    networks:
      default:
        ipv4_address: 172.31.255.2
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped
  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    env_file: ../.env
    environment:
      APP_PORT: "8080"
      TRUSTED_PROXIES: 172.31.255.2
      S3_ENDPOINT: ${S3_ENDPOINT:-http://storage:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-devstore}
    expose: ["8080"]
    depends_on:
      redis:
        condition: service_healthy
      storage:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 20s
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      NUXT_API_INTERNAL_URL: http://api:8080
      HOST: 0.0.0.0
      PORT: "3000"
      NUXT_TELEMETRY_DISABLED: "1"
    expose: ["3000"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
  redis:
    image: redis:7.2@sha256:6372db89351b00ba0ddca437ff49ce2ed4beed8a961a27d8259060c9603c240d
    volumes: [redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  storage:
    image: rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes: [objects:/data]
volumes:
  redis:
  objects:
networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.255.0/24
