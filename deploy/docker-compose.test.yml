name: devstore-test
services:
  gateway:
    image: nginx:stable-alpine
    profiles: ["e2e"]
    environment:
      API_UPSTREAM: host.docker.internal:18080
      WEB_UPSTREAM: host.docker.internal:13000
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:18088:80"]
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../apps/admin/dist:/srv/admin:ro
  redis:
    image: redis:7.2@sha256:6372db89351b00ba0ddca437ff49ce2ed4beed8a961a27d8259060c9603c240d
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
  storage:
    image: rustfs/rustfs@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    environment:
      RUSTFS_ACCESS_KEY: devstore_test
      RUSTFS_SECRET_KEY: devstore_test_only
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "false"
    ports: ["127.0.0.1:19000:9000"]
    volumes: [test-objects:/data]
  clamav:
    image: clamav/clamav@sha256:974ff8d90d274ce85a0b9bb417497a6fd5201ef30f2fc83cb073b916f97727d5
    ports: ["127.0.0.1:13310:3310"]
    volumes: [test-clamav:/var/lib/clamav]
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:11025:1025", "127.0.0.1:18025:8025"]
    profiles: ["e2e"]
volumes:
  test-objects:
  test-clamav:
