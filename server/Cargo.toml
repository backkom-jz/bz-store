[package]
name = "devstore-server"
version = "0.1.0"
edition = "2024"
default-run = "devstore-server"

[dependencies]
axum = { version = "0.8", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "json", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
argon2 = "0.5"
jsonwebtoken = { version = "9", default-features = false }
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
subtle = "2"
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
object_store = { version = "0.12", features = ["aws"] }
bytes = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
validator = { version = "0.20", features = ["derive"] }
utoipa = { version = "5", features = ["axum_extras", "uuid", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
futures = "0.3"
clap = { version = "4", features = ["derive"] }
rpassword = "7"

[dev-dependencies]
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "cookies", "rustls-tls"] }
futures = "0.3"
